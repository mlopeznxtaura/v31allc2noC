<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V31 Architecture</title>
  <link rel="stylesheet" href="/css/style.css?v=1" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>V31 Architecture</h1>
      <p>7-input triangulation → 2 output tokens</p>
    </div>
    <span class="badge">app2.nextaura.us</span>
  </header>

  <main>
    <section class="panel arch-panel">
      <h2>Architecture flow</h2>
      <p class="hint">M1 → M2 → M3 model scalars, then Binary · Geometry · Language · Triangulation → NextFrame + LanguageToken.</p>
      <div id="arch-flow" class="arch-flow"></div>
    </section>

    <section class="panel">
      <h2>Inference</h2>
      <div class="grid">
        <div class="full">
          <label for="infer-text">Language input</label>
          <textarea id="infer-text" rows="3">system initialized mission active logic verified</textarea>
        </div>
        <div>
          <label for="infer-temp">Temperature</label>
          <input id="infer-temp" type="number" value="1" min="0.1" max="2" step="0.1" />
        </div>
        <div>
          <label for="infer-sandbox">Sandbox mode</label>
          <select id="infer-sandbox">
            <option value="true" selected>true</option>
            <option value="false">false (live)</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="primary" id="btn-infer">Run forward pass</button>
        <button type="button" class="secondary" id="btn-reset">Reset episode</button>
      </div>
      <pre class="output" id="infer-output">Ready.</pre>
    </section>
  </main>

  <script src="/js/app.js?v=1"></script>
</body>
</html>
